[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"


[project]
name = "compliant-financial-rag"
version = "0.1.0"
description = "Compliant Financial Document RAG and Audit Agent"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

authors = [
    {name = "Ahmed Helmy Ali Ramadan"},
    {name = "Mohamed Hassan Mohamed SAlem"}
]

dependencies = [
    "faiss-cpu>=1.7.0",
    "fastapi>=0.104.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langgraph>=0.0.20",
    "marshmallow>=3.20.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pdfplumber>=0.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "PyMuPDF>=1.23.0",
    "rank-bm25>=0.2.2",
    "scipy>=1.10.0",
    "sentence-transformers>=2.2.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.24.0",
]

# Optional development dependencies – install with `pip install -e .[dev]`
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"


[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".venv",
    "data",
    "models",
    "reports",
    "notebooks"
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B"
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
